version: '3.9'

# Credentials are read from the environment (or a git-ignored `.env` file that
# Compose loads automatically). Copy `.env.example` to `.env` and set
# POSTGRES_PASSWORD before running `docker compose up`. The `:?` form makes
# Compose refuse to start if the variable is unset or empty.

services:
  db:
    image: postgres:16-alpine
    container_name: ethos-protocol-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ethos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ethos_protocol
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port 5432 is intentionally not published to the host. Services on the
    # Compose network reach the database at `db:5432`. To connect from the host
    # for debugging, add a `ports: ["127.0.0.1:5432:5432"]` entry in a local,
    # uncommitted override file.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ethos_user} -d ethos_protocol"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ethos-protocol-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ethos_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/ethos_protocol
      REDIS_URL: redis://redis:6379
      NODE_ID: backend-primary
      CONSENSUS_STRATEGY: last_write_wins
      RUST_LOG: info
      # SQLite file on the named volume below. Survives `docker compose down`
      # (use `down -v` to delete it).
      DB_PATH: /var/lib/ethos-protocol/ethos-protocol.db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ethos_data:/var/lib/ethos-protocol

  redis:
    image: redis:7-alpine
    container_name: ethos-protocol-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  stellar-quickstart:
    image: stellar/quickstart:latest
    container_name: stellar-quickstart
    environment:
      NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
    ports:
      - "8000:8000"
      - "11626:11626"
    volumes:
      - quickstart_data:/var/lib/stellar

volumes:
  postgres_data:
  ethos_data:
  quickstart_data:
